<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Живое! — афиша концертов Перми. Топ-10, ближайшие события, календарь и карта. VK Mini App.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="./assets/img/logo.png" sizes="any">
  <title>Живое! — Афиша Перми — VK Mini App</title>

  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <link rel="preconnect" href="https://permlive.ru">
  <link rel="dns-prefetch" href="https://permlive.ru">
  <!-- VK Bridge -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">

  <!-- Yandex Maps JS API v3 — ключ только для vkminiapp_new -->
  <script>window.PermLiveMapSettings={apiKey:'30ae02d3-cd24-4741-849d-947b8c46c1a9'};window.PermLiveMapData={events:[],today:'',defaultDate:'',emotionDate:'',csrf:'',emotionMe:{is_auth:false}};</script>

  <link rel="stylesheet" href="./assets/css/style.css?v=20261008b">
  <link rel="stylesheet" href="./assets/css/maps.css?v=20261008a">
</head>
<body>
  <!-- Header как на сайте: заголовок + дропдаун городов + дропдаун разделов -->
  <header class="pl-header">
    <div class="pl-header__inner">
      <a class="pl-logo" href="./" id="pl-logo-home" aria-label="На главную">
        <img class="pl-logo__img" src="./assets/img/logo.png" alt="Живое!" width="28" height="28">
        <span class="pl-logo__text" id="header-city-title">Карта событий Перми</span>
      </a>
      <div class="city-dropdown" id="city-dropdown" data-current="perm">
        <button type="button" class="city-dropdown-btn" id="city-dropdown-btn" aria-haspopup="true" aria-expanded="false" aria-label="Выбор города">
          <i class="fa-solid fa-city"></i>
          <span id="city-dropdown-label">Пермь</span>
          <i class="fa-solid fa-chevron-down city-dropdown-chevron"></i>
        </button>
        <div class="city-dropdown-menu" id="city-dropdown-menu" role="menu"></div>
      </div>
      <div class="sections-dropdown" id="sections-dropdown">
        <button type="button" class="sections-dropdown-btn" id="sections-dropdown-btn" aria-haspopup="true" aria-expanded="false" aria-label="Разделы афиши">
          <i id="sections-dropdown-icon" class="far fa-calendar-alt"></i>
          <span id="sections-dropdown-label">Календарь</span>
          <i class="fa-solid fa-chevron-down sections-dropdown-chevron"></i>
        </button>
        <div class="sections-dropdown-menu" id="sections-dropdown-menu" role="menu">
          <a class="sections-dropdown-item" role="menuitem" href="#" data-section="feed"><i class="far fa-calendar-alt"></i><span>Календарь</span><i class="fa-solid fa-check" style="display:none"></i></a>
          <a class="sections-dropdown-item" role="menuitem" href="#" data-section="map"><i class="fa-solid fa-location-dot"></i><span>Карта</span><i class="fa-solid fa-check" style="display:none"></i></a>
          <a class="sections-dropdown-item" role="menuitem" href="#" data-section="timeline"><i class="fa-solid fa-list-ul"></i><span>Таймлайн</span><i class="fa-solid fa-check" style="display:none"></i></a>
          <a class="sections-dropdown-item" role="menuitem" href="#" data-section="cities"><i class="fa-solid fa-city"></i><span>Все города</span><i class="fa-solid fa-check" style="display:none"></i></a>
        </div>
      </div>
      <button type="button" class="propose-btn" id="propose-btn" aria-label="Предложить событие">
        <i class="fa-solid fa-plus"></i>
        <span>Предложить событие</span>
      </button>
    </div>
  </header>

  <!-- Tab content -->
  <main id="app">
    <!-- FEED TAB -->
    <section id="view-feed" class="view view--active">
      <!-- Calendar as on site — месяц слева выше ленты, навигация переехала в хедер -->
      <div id="feed-calendar-wrap" class="feed-calendar-wrap">
        <div class="calendar-month-label" id="calendar-month-label"></div>
        <div id="feed-calendar" class="feed-calendar">
          <button class="calendar-arrow left hidden" aria-label="Назад"><i class="fas fa-chevron-left"></i></button>
          <div class="calendar-dates">
            <div class="calendar-dates-inner" id="calendar-dates-inner"></div>
          </div>
          <button class="calendar-arrow right hidden" aria-label="Вперёд"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>
      <!-- Поиск ниже календаря (раньше был в хедере) -->
      <div class="pl-header__search" id="header-search" style="margin:12px 0">
        <i class="fas fa-search"></i>
        <input id="search-input" type="search" placeholder="Искать среди концертов" autocomplete="off">
        <button id="search-clear" class="search-clear" aria-label="Очистить поиск" style="display:none"><i class="fas fa-times-circle"></i></button>
      </div>

      <!-- Feed Sliders -->
      <div id="feed-sliders">

        <!-- Top-10 -->
        <div class="horizontal-slider top-10" id="slider-top10">
          <h2 class="section-title">
            <a class="section-header-wrapper" id="top10-title-link" href="#"><i class="fas fa-star"></i> Топ-10 концертов</a>
            <a class="section-count-badge" id="top10-badge" style="display:none"></a>
          </h2>
          <div class="horizontal-slider-row" id="top10-row"></div>
          <div class="horizontal-slider-arrow left hidden"><i class="fas fa-chevron-left"></i></div>
          <div class="horizontal-slider-arrow right hidden"><i class="fas fa-chevron-right"></i></div>
        </div>

        <!-- Ближайшие -->
        <div class="horizontal-slider upcoming" id="slider-upcoming">
          <h2 class="section-title">
            <a class="section-header-wrapper" id="upcoming-title-link" href="#"><i class="fas fa-calendar"></i> Ближайшие события</a>
            <a class="section-count-badge" id="upcoming-badge" style="display:none"></a>
          </h2>
          <div class="horizontal-slider-row" id="upcoming-row"></div>
          <div class="horizontal-slider-arrow left hidden"><i class="fas fa-chevron-left"></i></div>
          <div class="horizontal-slider-arrow right hidden"><i class="fas fa-chevron-right"></i></div>
        </div>

        <!-- Для вас (VK рекомендации) — как на сайте, только если есть -->
        <div class="horizontal-slider foryou" id="slider-foryou" style="display:none">
          <h2 class="section-title">
            <a class="section-header-wrapper" id="foryou-title-link" href="#"><i class="fa-solid fa-heart"></i> Рекомендации для вас</a>
            <a class="section-count-badge" id="foryou-badge" style="display:none"></a>
          </h2>
          <div class="horizontal-slider-row" id="foryou-row"></div>
          <div class="horizontal-slider-arrow left hidden"><i class="fas fa-chevron-left"></i></div>
          <div class="horizontal-slider-arrow right hidden"><i class="fas fa-chevron-right"></i></div>
        </div>

        <!-- Промокоды (Яндекс Афиша) — ниже рекомендаций -->
        <div class="horizontal-slider promo" id="slider-promo" style="display:none">
          <h2 class="section-title">
            <a class="section-header-wrapper" id="promo-title-link" href="#"><i class="fa-solid fa-percent"></i> Промокоды на билеты</a>
            <a class="section-count-badge" id="promo-badge" style="display:none"></a>
          </h2>
          <div class="horizontal-slider-row" id="promo-row"></div>
          <div class="horizontal-slider-arrow left hidden"><i class="fas fa-chevron-left"></i></div>
          <div class="horizontal-slider-arrow right hidden"><i class="fas fa-chevron-right"></i></div>
        </div>

        <!-- Дата / диапазон — показывается только при выборе даты -->
        <div class="horizontal-slider withdate" id="slider-date" style="display:none">
          <h2 class="section-title">
            <a class="section-header-wrapper" id="date-title-link" href="#"><i class="fas fa-calendar"></i> <span id="date-title-text"></span></a>
            <a class="section-count-badge" id="date-badge" style="display:none"></a>
          </h2>
          <div class="horizontal-slider-row" id="date-row"></div>
          <div class="horizontal-slider-arrow left hidden"><i class="fas fa-chevron-left"></i></div>
          <div class="horizontal-slider-arrow right hidden"><i class="fas fa-chevron-right"></i></div>
        </div>

      </div>

      <!-- Timeline -->
      <div id="timeline-wrap" class="timeline-wrap">
        <div id="concert-container" class="cascade-element"></div>
        <div id="timeline-empty" class="timeline-empty hidden">
          <p id="timeline-empty-text"><i class="fas fa-calendar-xmark"></i> На эту дату концертов нет</p>
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button id="btn-show-all" class="pl-btn">Показать все ближайшие</button>
            <button id="btn-propose" class="pl-btn pl-btn--light" style="display:none">Предложить событие</button>
          </div>
        </div>
      </div>
    </section>

    <!-- MAP TAB -->
    <section id="view-map" class="view">
      <div id="map" class="map"></div>
      <!-- Controls injected by JS -->
    </section>

    <!-- CITIES VIEW (как /cities/ на сайте: выбор + карта России) -->
    <section id="view-cities" class="view">
      <div class="cities-page">
        <h1 class="cities-main-title">Выбери свой город</h1>
        <p class="cities-subtitle" id="cities-subtitle"></p>
        <div class="cities-toolbar">
          <input type="search" id="cities-filter" class="cities-filter" placeholder="Найти город…" autocomplete="off" aria-label="Найти город">
          <button type="button" id="cities-geo" class="cities-geo-btn">
            <i class="fa-solid fa-location-crosshairs"></i>
            <span>Определить</span>
          </button>
        </div>
        <p class="cities-geo-hint" id="cities-geo-hint" style="display:none"></p>
        <div id="cities-groups"></div>
        <section class="cities-map-section" id="cities-map-section">
          <h2 class="cities-map-title">Карта городов</h2>
          <div class="cities-map-wrap">
            <div id="cities-russia-map" role="application" aria-label="Карта России с городами"></div>
            <div class="cities-map-zoom" role="group" aria-label="Масштаб карты">
              <button type="button" id="cities-zoom-in" aria-label="Приблизить карту" title="Приблизить"><i class="fa-solid fa-plus"></i></button>
              <button type="button" id="cities-zoom-out" aria-label="Отдалить карту" title="Отдалить"><i class="fa-solid fa-minus"></i></button>
            </div>
          </div>
        </section>
      </div>
    </section>

    <!-- DETAIL VIEW -->
    <section id="view-detail" class="view">
      <div id="detail-content" class="detail"></div>
    </section>

    <!-- ADD TAB -->
    <section id="view-add" class="view">
      <div class="add-page" style="max-width:600px;margin:0 auto;padding:24px 0">
        <h2 style="font-size:18px;font-weight:700;margin-bottom:8px">Предложить событие</h2>
        <p style="color:#666;margin-bottom:16px">Не нашел событие в списке? Закинь ссылку, добавлю!</p>
        <form id="add-form" style="display:flex;gap:8px">
          <input id="add-link" type="text" placeholder="vk.ru/wall..." required style="flex:1;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font-size:14px">
          <button type="submit" class="pl-btn">Отправить</button>
        </form>
        <p id="add-status" style="margin-top:12px;color:#666;font-size:13px"></p>
      </div>
    </section>
  </main>

  <!-- Calendar modal (shared) -->
  <div id="cal-overlay" class="pl-map-calendar-overlay"></div>
  <div id="cal-modal" class="pl-map-calendar-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="pl-map-calendar-modal__cal"></div>
  </div>

  <!-- Event sheet (mobile bottom sheet / desktop card) -->
  <div id="event-sheet-overlay" class="sheet-overlay"></div>
  <div id="event-sheet" class="sheet" role="dialog" aria-modal="true">
    <div class="sheet__handle"></div>
    <button class="sheet__close" aria-label="Закрыть">&times;</button>
    <div id="sheet-content"></div>
  </div>

  <!-- Mobile footer — показывается только на смартфонах, с подписями -->
  <nav class="pl-tabbar" role="tablist" aria-label="Навигация">
    <button class="pl-tabbar__btn pl-tabbar__btn--active" data-tab="feed" role="tab" aria-selected="true">
      <i class="fa-solid fa-calendar"></i><span>Календарь</span>
    </button>
    <button class="pl-tabbar__btn" data-tab="map" role="tab" aria-selected="false">
      <i class="fa-solid fa-map-location-dot"></i><span>Карта</span>
    </button>
    <button class="pl-tabbar__btn" id="tabbar-timeline" role="tab" aria-selected="false" aria-label="Таймлайн">
      <i class="fa-solid fa-list-ul"></i><span>Таймлайн</span>
    </button>
    <button class="pl-tabbar__btn" data-tab="cities" role="tab" aria-selected="false">
      <i class="fa-solid fa-city"></i><span>Города</span>
    </button>
    <button class="pl-tabbar__btn" data-tab="add" role="tab" aria-selected="false">
      <i class="fa-solid fa-plus"></i><span>Предложить</span>
    </button>
  </nav>

  <!-- Toast -->
  <div id="toast" class="pl-toast"></div>

  <script src="./assets/js/maps/map-core.js?v=20260910" defer></script>
  <script src="./assets/js/maps/events-map.js?v=20261008a" defer></script>
  <script type="module" src="./assets/js/app.js?v=20261008b"></script>
</body>
</html>
